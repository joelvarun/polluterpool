[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polluterpool"
version = "0.1.0"
description = "Shared-prefix group testing for order dependent test localization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]

[project.optional-dependencies]
bench = ["matplotlib>=3.7"]

[project.scripts]
polluterpool = "polluterpool.cli:main"

[tool.setuptools]
packages = ["polluterpool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
